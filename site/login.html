<h1>Connexion Admin</h1>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Mot de passe">
<button id="login-btn">Connexion</button>
<p id="msg"></p>

<script>
document.getElementById("login-btn").onclick = () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  fetch("/login", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email,password})})
  .then(res=>res.json())
  .then(data=>{
    if(data.token){ localStorage.setItem("token", data.token); window.location.href="index.html"; }
    else document.getElementById("msg").textContent=data.message;
  });
};
</script>
