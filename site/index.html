<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bienvenue chez BW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="#">Accueil</a>
      <a href="#">Menu</a>
      <a href="#">Contact</a>
    </nav>
    <div id="langues">
      <img src="../images/fr.png" alt="Français">
      <img src="../images/en.png" alt="English">
      <img src="../images/es.png" alt="Español">
    </div>
  </header>

  <img id="logo" src="../images/logo.png" alt="Logo BW">

  <div id="plat-du-jour">Plat du jour : Magret de canard 🍽️</div>

  <div id="horloge"></div>

  <script>
    function updateClock() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const date = now.toLocaleDateString('fr-FR', options);
      const time = now.toLocaleTimeString('fr-FR');
      document.getElementById('horloge').textContent = `${date} - ${time}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
