<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu – Brasserie BW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="menu-title">Notre carte</h1>
  <div id="menu-container"></div>
  <script src="lang.js"></script>
  <script>
    async function afficherMenu(lang) {
      const res = await fetch("menu.json");
      const menu = await res.json();
      const container = document.getElementById("menu-container");
      container.innerHTML = "";

      for (const [categorie, items] of Object.entries(menu)) {
        const section = document.createElement("section");
        section.innerHTML = `<h2>${categorie.toUpperCase()}</h2>`;
        items.forEach(item => {
          const div = document.createElement("div");
          div.innerHTML = `<strong>${item.nom}</strong> – ${item.prix} €`;
          section.appendChild(div);
        });
        container.appendChild(section);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const lang = localStorage.getItem("lang") || "fr";
      afficherMenu(lang);
    });
  </script>
</body>
</html>
