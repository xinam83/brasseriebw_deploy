<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Soirées – Brasserie BW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="soirees-title">Nos soirées</h1>
  <div id="soirees-list"></div>
  <script src="lang.js"></script>
  <script>
    async function afficherSoirees(lang) {
      const res = await fetch("soirees.json");
      const soirees = await res.json();
      const container = document.getElementById("soirees-list");
      container.innerHTML = "";
      soirees.forEach(s => {
        const div = document.createElement("div");
        div.innerHTML = `
          <h2>${s.nom}</h2>
          <p>Date : ${s.date}</p>
          <p>Début : ${s.heure_debut}</p>
          <p>Fin : ${s.heure_fin}</p>
          <p>Produits : ${s.produits.join(", ") || "—"}</p>
        `;
        container.appendChild(div);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const lang = localStorage.getItem("lang") || "fr";
      afficherSoirees(lang);
    });
  </script>
</body>
</html>
