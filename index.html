<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasserie BW</title>
  
  <!-- CSS principal -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->
  <link rel="icon" href="images/k7f6.ico" type="image/x-icon">
</head>
<body>

<!-- Header -->
<header>
  <img src="images/logo.jpg" alt="Logo Brasserie BW" class="logo">
  <h1>Brasserie BW</h1>
  <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="reservation.html">Réservation</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>
</header>

<!-- Section Plat du jour -->
<section class="plat-jour">
  <img id="plat-image" src="images/q5up.jpg" alt="Plat du jour" class="plat">
  <div id="plat-nom" class="nom-plat">Lasagne</div>
  <div id="plat-prix" class="prix">12,90 €</div>
</section>

<!-- Footer -->
<footer>
  &copy; 2025 Brasserie BW - Tous droits réservés
</footer>

<!-- Script Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "TA_CLE_API",
    authDomain: "brasserie-bw-4cdb0.firebaseapp.com",
    projectId: "brasserie-bw-4cdb0",
    storageBucket: "brasserie-bw-4cdb0.appspot.com",
    messagingSenderId: "XXXXXXX",
    appId: "1:XXXXXXX:web:XXXXXXX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const docRef = doc(db, "plats", "platdujour");
  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      document.getElementById("plat-nom").textContent = data.nom;
      document.getElementById("plat-prix").textContent = data.prix;
      document.getElementById("plat-image").src = data.image;
    }
  });
</script>

</body>
</html>
