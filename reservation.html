<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation - Restaurant</title>
<style>
  body { font-family: Arial, sans-serif; margin:20px; }
  h1 { color:#333; }
  form { max-width: 600px; margin-top:20px; }
  label { display:block; margin-top:10px; }
  input, select { width:100%; padding:5px; margin-top:5px; }
  button { margin-top:15px; padding:10px 20px; cursor:pointer; }
  .summary { margin-top:20px; padding:10px; border:1px solid #ccc; }
</style>
</head>
<body>
<h1>Réservation / Commande</h1>

<form id="reservationForm">
  <label>Nom :
    <input type="text" id="name" required>
  </label>
  <label>Email :
    <input type="email" id="email" required>
  </label>
  <label>Téléphone :
    <input type="tel" id="phone" required>
  </label>
  <label>Date de réservation :
    <input type="date" id="date" required>
  </label>
  <label>Heure de réservation :
    <input type="time" id="time" required>
  </label>
  <label>Nombre de personnes :
    <input type="number" id="people" min="1" required>
  </label>

  <label>
    <input type="checkbox" id="privateEvent"> Privatisation de la brasserie (20 pers. min, 25€/pers.)
  </label>
  <label>
    <input type="checkbox" id="roomRental"> Location salle à l’étage
  </label>
  <select id="roomDuration" disabled>
    <option value="full">Journée - 250€</option>
    <option value="half">Demi-journée - 150€</option>
  </select>

  <label>
    <input type="checkbox" id="deliveryOption"> Livraison (minimum 15€)
  </label>
  <label>
    <input type="checkbox" id="clickCollectOption"> Clic & Collect
  </label>

  <button type="submit">Confirmer réservation / commande</button>
</form>

<div class="summary" id="summary"></div>
<button onclick="printReservations()">Imprimer réservation</button>

<script>
const form = document.getElementById('reservationForm');
const summaryDiv = document.getElementById('summary');
const roomRentalCheckbox = document.getElementById('roomRental');
const roomDurationSelect = document.getElementById('roomDuration');

roomRentalCheckbox.addEventListener('change', () => {
  roomDurationSelect.disabled = !roomRentalCheckbox.checked;
});

let currentReservation = null;

form.addEventListener('submit', (e) => {
  e.preventDefault();
  
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const phone = document.getElementById('phone').value;
  const date = document.getElementById('date').value;
  const time = document.getElementById('time').value;
  const people = parseInt(document.getElementById('people').value);
  const privateEvent = document.getElementById('privateEvent').checked;
  const roomRental = document.getElementById('roomRental').checked;
  const roomDuration = document.getElementById('roomDuration').value;
  const delivery = document.getElementById('deliveryOption').checked;
  const clickCollect = document.getElementById('clickCollectOption').checked;

  let totalPrice = 0;
  let notes = '';

  // Privatisation brasserie
  if(privateEvent){
    if(people < 20){
      alert("Minimum 20 personnes pour la privatisation !");
      return;
    }
    totalPrice += people * 25;
    notes += `Privatisation de la brasserie: ${people} pers x 25€ = ${people*25}€\n`;
  }

  // Location salle
  if(roomRental){
    const roomPrice = roomDuration === 'full' ? 250 : 150;
    totalPrice += roomPrice;
    notes += `Location salle (${roomDuration === 'full' ? 'Journée' : 'Demi-journée'}): ${roomPrice}€\n`;
  }

  // Livraison minimum
  if(delivery){
    notes += "Option livraison activée (minimum 15€ à vérifier selon commande).\n";
  }
  if(clickCollect){
    notes += "Option Clic & Collect activée.\n";
  }

  currentReservation = {
    name,email,phone,date,time,people,privateEvent,roomRental,roomDuration,delivery,clickCollect,totalPrice
  };

  summaryDiv.innerHTML = `<pre>
Réservation confirmée:
Nom: ${name}
Email: ${email}
Téléphone: ${phone}
Date: ${date}
Heure: ${time}
Personnes: ${people}
${notes}
Prix total: ${totalPrice}€
  </pre>`;

  alert("Réservation enregistrée !");
});

// Impression
function printReservations(){
  if(!currentReservation) { alert("Aucune réservation à imprimer."); return; }
  let printWindow = window.open('', '', 'height=600,width=800');
  printWindow.document.write('<html><head><title>Réservation</title></head><body>');
  printWindow.document.write('<h1>Réservation</h1><pre>' + JSON.stringify(currentReservation, null, 2) + '</pre>');
  printWindow.document.write('</body></html>');
  printWindow.document.close();
  printWindow.print();
}
</script>
</body>
</html>
