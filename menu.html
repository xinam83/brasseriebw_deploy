<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu - Restaurant</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .menu-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
    }
    .rupture {
      opacity: 0.5;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <h1>Notre Menu</h1>
  <div id="menu-container"></div>

  <script>
    async function chargerMenu() {
      let menuData = null;

      // Vérifier si une version existe dans localStorage
      const sauvegarde = localStorage.getItem('menuData');
      if (sauvegarde) {
        menuData = JSON.parse(sauvegarde);
      } else {
        // Sinon, charger menu.json
        const response = await fetch('menu.json');
        menuData = await response.json();
      }

      afficherMenu(menuData);
    }

    function getPrix(item) {
      const now = new Date();
      const hours = now.getHours();

      if (item.prix_apres_17h && hours >= 17 && hours < 3) return item.prix_apres_17h;
      if (item.prix_midi && hours >= 9 && hours < 15) return item.prix_midi;
      if (item.prix_soir && hours >= 17 && hours < 24) return item.prix_soir;
      if (item.prix_happyhour && hours >= 17 && hours < 24) return item.prix_happyhour;
      return item.prix || 0;
    }

    function afficherMenu(menuData) {
      const menuContainer = document.getElementById('menu-container');
      menuContainer.innerHTML = '';

      const toutesCategories = [
        { titre: "Plats", items: menuData.plats },
        { titre: "Desserts", items: menuData.desserts },
        { titre: "Boissons", items: menuData.boissons }
      ];

      toutesCategories.forEach(cat => {
        const titre = document.createElement('h2');
        titre.textContent = cat.titre;
        menuContainer.appendChild(titre);

        cat.items.forEach(item => {
          const div = document.createElement('div');
          div.classList.add('menu-item');
          if (item.rupture) div.classList.add('rupture');

          div.innerHTML = `
            <h3>${item.nom}</h3>
            <p>Prix: ${getPrix(item)} €</p>
            ${item.mention ? `<p>${item.mention}</p>` : ''}
          `;

          // Afficher disponibilité
          if (item.disponibilite && item.disponibilite.length > 0) {
            div.innerHTML += `<p>Disponible: ${item.disponibilite.join(', ')}</p>`;
          }

          menuContainer.appendChild(div);
        });
      });
    }

    chargerMenu();
    // Rafraîchir toutes les minutes
    setInterval(chargerMenu, 60000);
  </script>
</body>
</html>
