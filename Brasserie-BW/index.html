<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Restaurant</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7043">
</head>
<body>
  <header>
    <h1>🍽 Mon Restaurant</h1>
  </header>

  <main>
    <!-- MENU -->
    <section id="menu">
      <h2>Menu</h2>
      <div id="menu-items" class="menu-grid"></div>
    </section>

    <!-- PANIER -->
    <section id="cart">
      <h2>Panier</h2>
      <ul id="cart-items"></ul>
      <p>Total : <span id="total">0</span> €</p>
      <button id="checkout">Valider la commande</button>
    </section>

    <!-- RESERVATION -->
    <section id="reservation">
      <h2>Réservation</h2>
      <form id="reservation-form">
        <input type="text" id="name" placeholder="Nom" required>
        <input type="date" id="date" required>
        <input type="time" id="time" required>
        <input type="number" id="guests" placeholder="Nombre de personnes" required>
        <button type="submit">Réserver</button>
      </form>
      <p id="reservation-msg"></p>
    </section>
  </main>

  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker enregistré !'))
        .catch(err => console.error('Erreur SW:', err));
    }
  </script>
</body>
</html>
